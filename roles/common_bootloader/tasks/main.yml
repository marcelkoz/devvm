- name: Fetch root partition UUID
  ansible.builtin.command: lsblk -dno UUID {{ common_bootloader_root_partition_path }}
  register: common_bootloader_root_partition_uuid_result
  changed_when: false
  failed_when: common_bootloader_root_partition_uuid_result.rc != 0

- name: Assert root partition UUID command succeeded
  ansible.builtin.assert:
    that: not common_bootloader_root_partition_uuid_result.failed

- name: Root partition UUID
  ansible.builtin.debug:
    msg: '{{ common_bootloader_root_partition_uuid_result.stdout }}'

- name: Import kernel tasks
  ansible.builtin.import_tasks: kernel.yml
  when: not common_bootloader_bootstrap_phase

- name: Create systemd-boot configuration directories
  ansible.builtin.file:
    path: '{{ item }}'
    mode: '{{ global_standard_directory_permissions }}'
    state: directory
  loop:
    - '{{ common_bootloader_parent_directory_path }}'
    - '{{ common_bootloader_entries_directory_path }}'

- name: Template systemd-boot main config file
  ansible.builtin.template:
    src: 'templates/loader.conf.j2'
    dest: '{{ common_bootloader_config_file_path }}'
    mode: '{{ global_standard_file_permissions }}'

- name: Template systemd-boot entries
  ansible.builtin.template:
    src: templates/arch.conf.j2
    dest: '{{ common_bootloader_entries_directory_path }}/{{ item.filename }}'
    mode: '{{ global_standard_file_permissions }}'
  loop: '{{ common_bootloader_entries }}'
  loop_control:
    label: '{{ item.filename }}'
