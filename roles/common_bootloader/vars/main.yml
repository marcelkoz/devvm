common_bootloader_parent_directory_path: '{{ common_bootloader_boot_mount_point }}/loader'
common_bootloader_entries_directory_path: '{{ common_bootloader_parent_directory_path }}/entries'
common_bootloader_config_file_path: '{{ common_bootloader_parent_directory_path }}/loader.conf'
common_bootloader_entries:
  - { template: 'templates/arch.conf.j2', name: 'arch.conf' }
  - { template: 'templates/arch-shell.conf.j2', name: 'arch-shell.conf' }
  - { template: 'templates/arch-fallback.conf.j2', name: 'arch-fallback.conf' }
