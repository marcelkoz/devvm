- name: Template wired network interface config files
  ansible.builtin.template:
    src: templates/xx-wired.network.j2
    dest: '{{ common_network_interface_config_directory_path }}/20-wired.network'
    mode: '0444'

- name: Symlink resolv.conf file
  ansible.builtin.file:
    src: '{{ common_network_resolv_symlink_source_path }}'
    dest: '{{ common_network_resolv_symlink_destination_path }}'
    force: true
    follow: false
    state: link

- name: Template ssh config file
  ansible.builtin.template:
    src: templates/xx-ssh.conf.j2
    dest: '{{ common_network_ssh_config_directory_path }}/50-ssh.conf'
    mode: '0444'

- name: Enable and start networking services
  ansible.builtin.service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop:
    - sshd
    - systemd-networkd
    - systemd-resolved
