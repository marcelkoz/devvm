arch_pacman_lock_file_path: /var/lib/pacman/db.lck

arch_packages:
  misc:
    - ansible
    - ansible-core
    - ansible-lint
    - azure-cli
    - base-devel
    - curl
    - docker
    - docker-buildx
    - docker-compose
    - flatpak
    - fuse # appimages
    - fzf
    - git
    - gtkmm3 # vmware clipboard sharing
    - jq
    - less
    - man-db
    - man-pages
    - nano
    - open-vm-tools
    - openssh
    - packer
    - podman
    - rclone
    - ripgrep
    - sqlite
    - terraform
    - tree
    - trivy
    - ttf-fira-code
    - unzip
    - vim
    - zip

  kubernetes:
    - argocd
    - helm
    - helmfile
    - kubectl
    - talosctl

  networking:
    - bind
    - iproute2
    - iputils
    - whois
    - wireshark-qt

  languages:
    - go
    - nodejs
    - npm
    - pyenv # python
    - python
    - python-black
    - python-pip
    - python-pipx
    - ruff # python
    - rustup # rust

  shells:
    - bash
    - bash-completion
    - fish
    - nushell

  llm:
    - opencode

  graphical:
    - chromium
    - code
    - firefox
    - kde-graphics-meta
    - kde-system-meta
    - kde-utilities-meta
    - kitty
    - plasma-login-manager
    - plasma-meta

arch_packages_absent:
  - google-chrome
  - visual-studio-code-bin
  - gemini-cli
  - nvm

arch_npm_global_packages_parent_path: '{{ arch_dev_user_home_path }}/.local'

arch_npm_global_packages:
  - '@docmd/core'
  - basemind

arch_npm_global_packages_absent: []

arch_pipx_packages:
  - lola-ai

arch_pipx_packages_absent: []

arch_flatpak_packages:
  flathub:
    - com.usebruno.Bruno

arch_flatpak_packages_absent:
  flathub: []

arch_vscode_extensions:
  - golang.go
  - hashicorp.terraform
  - ms-python.debugpy
  - ms-python.python
  - ms-python.vscode-python-envs
  - redhat.ansible
  - redhat.vscode-yaml
  - ritwickdey.liveserver
  - sst-dev.opencode

arch_vscode_extensions_absent: []
