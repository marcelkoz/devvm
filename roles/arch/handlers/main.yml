- name: Restart docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Restart plasmalogin
  ansible.builtin.service:
    name: plasmalogin
    state: restarted

- name: Run dotfiles script
  # noqa: no-changed-when
  ansible.builtin.command:
    argv:
      - python
      - '{{ arch_git_repos_directory_path }}/dotfiles/dotfiles.py'
      - --create-symlinks
      - --disable-safe-mode
      - '{{ arch_git_repos_directory_path }}/dotfiles'
    become_user: '{{ arch_dev_user_name }}'
