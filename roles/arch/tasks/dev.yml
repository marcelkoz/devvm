- name: Create vscode configuration directories
  ansible.builtin.file:
    path: '{{ item }}'
    mode: '0755'
    state: directory
  loop:
    - '{{ arch_vscode_config_directory_path }}'
    - '{{ arch_vscode_config_directory_path }}/User'

- name: Template vscode settings file
  ansible.builtin.template:
    src: 'templates/vscode-settings.json.j2'
    dest: '{{ arch_vscode_config_directory_path }}/User/settings.json'
    mode: '0644'

- name: Create agents skills directory
  ansible.builtin.file:
    path: '{{ arch_dev_user_home_path }}/.agents/skills'
    mode: '0755'
    state: directory

- name: Create opencode configuration directory
  ansible.builtin.file:
    path: '{{ arch_opencode_config_directory_path }}'
    mode: '0755'
    state: directory

- name: Template opencode configuration
  ansible.builtin.template:
    src: 'templates/opencode.jsonc.j2'
    dest: '{{ arch_opencode_config_file_path }}'
    mode: '0644'

- name: Clone AI skills repositories
  # noqa: latest
  ansible.builtin.git:
    repo: '{{ item.value }}'
    dest: '{{ arch_ai_skills_repos_parent_directory_path }}/{{ item.key | replace("_", "-") }}'
    clone: true
  loop: '{{ arch_ai_skills_repos | dict2items }}'

- name: Find all AI skills directories
  ansible.builtin.find:
    paths: '{{ arch_ai_skills_repos_parent_directory_path }}/{{ item.key | replace("_", "-") }}/skills'
    file_type: directory
    recurse: false
  loop: '{{ arch_ai_skills_repos | dict2items }}'
  register: arch_ai_skills_directories

- name: Symlink the AI skills directories
  ansible.builtin.file:
    src: '{{ item }}'
    dest: '{{ arch_dev_user_home_path }}/.agents/skills/{{ item | basename }}'
    state: link
  loop: '{{ arch_ai_skills_directories.results | map(attribute="files") | flatten | map(attribute="path") }}'
