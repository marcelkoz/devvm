- name: Set vscode config directory fact
  ansible.builtin.set_fact:
    arch_vscode_config_directory_path: '{{ arch_dev_user_result.home }}/.config/Code - OSS'

- name: Template vscode settings file
  ansible.builtin.template:
    src: 'templates/vscode-settings.json.j2'
    dest: '{{ arch_vscode_config_directory_path }}/User/settings.json'
    mode: '0644'

- name: Add nvm to shell environment files
  ansible.builtin.blockinfile:
    path: '{{ arch_dev_user_result.home }}/.bashenv'
    append_newline: true
    prepend_newline: true
    block: '. /usr/share/nvm/init-nvm.sh'

- name: Clone AI skills repositories
  # noqa: latest
  ansible.builtin.git:
    repo: '{{ item.value }}'
    dest: '{{ arch_third_party_repos_directory_path }}/{{ item.key }}'
    clone: true
  loop: '{{ arch_global_ai_skills_repos | dict2items }}'

- name: Find all AI skills directories
  ansible.builtin.find:
    paths: '{{ arch_third_party_repos_directory_path }}/{{ item.key }}/skills'
    file_type: directory
    recurse: false
  loop: '{{ arch_global_ai_skills_repos | dict2items }}'
  register: arch_ai_skills_directories

- name: Symlink the AI skills directories
  ansible.builtin.file:
    src: '{{ item }}'
    dest: '{{ arch_dev_user_result.home }}/.agents/skills/{{ item | basename }}'
    state: link
  loop: '{{ arch_ai_skills_directories.results | map(attribute="files") | flatten | map(attribute="path") }}'

- name: Template opencode configuration
  ansible.builtin.template:
    src: 'templates/opencode.jsonc.j2'
    dest: '{{ arch_opencode_config_file_path }}'
    mode: '0644'
