- name: Create vscode configuration directories
  ansible.builtin.file:
    path: '{{ item }}'
    mode: '{{ global_standard_directory_permissions }}'
    state: directory
  loop:
    - '{{ arch_vscode_config_directory_path }}'
    - '{{ arch_vscode_config_directory_path }}/User'

- name: Template vscode settings file
  ansible.builtin.template:
    src: 'templates/vscode-settings.json.j2'
    dest: '{{ arch_vscode_config_directory_path }}/User/settings.json'
    mode: '{{ global_standard_file_permissions }}'

- name: Create bash completions script directory
  ansible.builtin.file:
    path: '{{ arch_bash_completion_script_directory_path }}'
    mode: '{{ global_standard_directory_permissions }}'
    state: directory
