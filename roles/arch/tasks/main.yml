---
- name: Import common_bootloader role
  ansible.builtin.include_role:
    name: common_bootloader

- name: Import common_network role
  ansible.builtin.include_role:
    name: common_network

- name: General configuration
  ansible.builtin.include_tasks: general.yml

- name: Git configuration
  ansible.builtin.include_tasks: git.yml
  args:
    apply:
      become_user: '{{ arch_dev_user_name }}'

- name: AUR configuration
  ansible.builtin.include_tasks: aur.yml
  tags:
    - aur

- name: KDE configuration
  ansible.builtin.include_tasks: kde.yml
  args:
    apply:
      become_user: '{{ arch_dev_user_name }}'

- name: Development configuration
  ansible.builtin.include_tasks: dev.yml
  args:
    apply:
      become_user: '{{ arch_dev_user_name }}'
