- name: Create opencode configuration directory
  ansible.builtin.file:
    path: '{{ arch_opencode_config_directory_path }}'
    mode: '{{ arch_standard_directory_permissions }}'
    state: directory

- name: Template opencode configuration
  ansible.builtin.template:
    src: 'templates/opencode.jsonc.j2'
    dest: '{{ arch_opencode_config_file_path }}'
    mode: '{{ arch_standard_file_permissions }}'

- name: Generate lola bash completion script
  ansible.builtin.command:
    cmd: '{{ arch_ai_lola_executable_path }} completions bash'
  register: arch_ai_lola_bash_completion_script_contents
  changed_when: false

- name: Save lola bash completion script
  ansible.builtin.copy:
    content: '{{ arch_ai_lola_bash_completion_script_contents.stdout }}'
    dest: '{{ arch_bash_completion_script_directory_path }}/lola'
    mode: '{{ arch_standard_file_permissions }}'

- name: Add lola ai modules (without submodules)
  ansible.builtin.command:
    argv:
      - '{{ arch_ai_lola_executable_path }}'
      - mod
      - add
      - --name
      - '{{ module_name }}'
      - '{{ item.value }}'
    creates: '{{ arch_ai_lola_modules_path }}/{{ module_name }}'
  loop: '{{ arch_ai_module_repos | dict2items }}'
  vars:
    module_name: '{{ item.key | replace("_", "-") }}'

- name: Add lola ai modules (with submodules)
  ansible.builtin.command:
    argv:
      - '{{ arch_ai_lola_executable_path }}'
      - mod
      - add
      - --name
      - '{{ module_name }}'
      - --module-content
      - '{{ module_name }}/module'
      - '{{ item.value }}'
    creates: '{{ arch_ai_lola_modules_path }}/{{ module_name }}'
  loop: '{{ arch_ai_module_repos_with_submodules | dict2items }}'
  vars:
    module_name: '{{ item.key | replace("_", "-") }}'

- name: Read installed lola modules file
  ansible.builtin.slurp:
    src: '{{ arch_ai_lola_installed_file_path }}'
  register: arch_ai_lola_installed_modules_data

- name: Parse the installed lola modules file
  ansible.builtin.set_fact:
    arch_ai_lola_installed_modules: '{{ (arch_ai_lola_installed_modules_data.content | b64decode | from_yaml).installations | map(attribute="module") }}'

- name: Install lola ai modules
  ansible.builtin.command:
    argv:
      - '{{ arch_ai_lola_executable_path }}'
      - install
      - '{{ module_name }}'
      - --assistant
      - '{{ arch_ai_module_output_type }}'
      - --scope
      - user
      # avoid global AGENTS.md pollution from installed modules
      - --append-context
      - ''
  when: module_name not in arch_ai_lola_installed_modules
  changed_when: true
  loop: '{{ arch_ai_module_repos.keys() + arch_ai_module_repos_with_submodules.keys() }}'
  vars:
    module_name: '{{ item | replace("_", "-") }}'
