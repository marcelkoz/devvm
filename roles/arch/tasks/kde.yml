- name: Template default XDG home directories
  ansible.builtin.template:
    src: templates/user-dirs.defaults.j2
    dest: /etc/xdg/user-dirs.defaults
    mode: '{{ global_standard_file_permissions }}'
  become: true
  become_user: root

- name: Get current KDE global theme
  ansible.builtin.command: kreadconfig6 --group KDE --key LookAndFeelPackage
  register: arch_current_kde_theme_result
  changed_when: false
  failed_when: arch_current_kde_theme_result.rc != 0

- name: Apply KDE global theme
  ansible.builtin.command:
    argv:
      - plasma-apply-lookandfeel
      - --platform
      - offscreen
      - --apply
      - '{{ arch_kde_global_theme }}'
  changed_when: true
  when: arch_current_kde_theme_result.stdout != arch_kde_global_theme

- name: Set the keyboard keymap in KDE
  community.general.kdeconfig:
    path: '{{ arch_kde_config_directory_path }}/kxkbrc'
    values:
      - group: Layout
        key: LayoutList
        value: '{{ arch_kde_keymap }}'
      - group: Layout
        key: Use
        bool_value: true
    backup: true
  notify:
    - Restart plasmalogin

- name: Set the power settings in KDE
  community.general.kdeconfig:
    path: '{{ arch_kde_config_directory_path }}/powerdevilrc'
    values:
      - groups: [AC, Display]
        key: '{{ item[0] }}'
        value: '{{ item[1] }}'
    backup: true
  loop:
    - [DimDisplayWhenIdle, '{{ arch_kde_power_dim.idle }}']
    - [DimDisplayIdleTimeoutSec, '{{ arch_kde_power_dim.timeout_seconds }}']
    - [TurnOffDisplayWhenIdle, '{{ arch_kde_power_turn_off.idle }}']
    - [TurnOffDisplayIdleTimeoutSec, '{{ arch_kde_power_turn_off.timeout_seconds }}']
  notify:
    - Restart plasmalogin

- name: Create autostart directory
  ansible.builtin.file:
    path: '{{ arch_kde_config_directory_path }}/autostart'
    mode: '{{ global_standard_directory_permissions }}'
    owner: '{{ arch_dev_user_name }}'
    group: '{{ arch_dev_user_name }}'
    state: directory

- name: Add applications to autostart
  ansible.builtin.file:
    src: '/usr/share/applications/{{ item }}'
    dest: '{{ arch_kde_config_directory_path }}/autostart/{{ item }}'
    state: link
  loop:
    - code-oss.desktop
    - kitty.desktop
    - org.kde.konsole.desktop
