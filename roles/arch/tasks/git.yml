- name: Template git config
  ansible.builtin.template:
    src: 'templates/gitconfig.j2'
    dest: '{{ item }}'
    mode: '0644'
  loop:
    - '{{ arch_dev_user_result.home }}/.gitconfig'

- name: Set repos directory fact
  ansible.builtin.set_fact:
    arch_repos_directory_path: '{{ arch_dev_user_result.home }}/{{ arch_dev_user_home_directories.repos }}'

- name: Clone repos to dev user
  # noqa: latest
  ansible.builtin.git:
    repo: '{{ item.value }}'
    dest: '{{ arch_repos_directory_path }}/{{ item.key }}'
    clone: true
  loop: '{{ arch_dev_user_git_repos | dict2items }}'
  register: arch_dev_user_repos_result

- name: Run dotfiles script
  # noqa: no-changed-when
  ansible.builtin.command:
    argv:
      - python
      - '{{ arch_repos_directory_path }}/dotfiles/dotfiles.py'
      - --create-symlinks
      - --disable-safe-mode
      - '{{ arch_repos_directory_path }}/dotfiles'

- name: Build yay AUR package
  ansible.builtin.command:
    argv:
      - makepkg
      - -sf
      - --needed
      - --noconfirm
    chdir: '{{ arch_repos_directory_path }}/yay'
    creates: '{{ arch_repos_directory_path }}/yay/pkg'

- name: List yay packages
  # noqa: no-changed-when
  ansible.builtin.command:
    argv:
      - makepkg
      - --packagelist
    chdir: '{{ arch_repos_directory_path }}/yay'
  register: arch_yay_package_list_result
