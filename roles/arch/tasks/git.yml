- name: Template git config
  ansible.builtin.template:
    src: 'templates/gitconfig.j2'
    dest: '{{ item }}'
    mode: '0644'
  loop:
    - '{{ arch_dev_user_result.home }}/.gitconfig'

- name: Set repo directories fact
  ansible.builtin.set_fact:
    arch_repos_directory_path: '{{ arch_dev_user_result.home }}/{{ arch_dev_user_home_directories.repos }}'
    arch_third_party_repos_directory_path: '{{ arch_dev_user_result.home }}/{{ arch_dev_user_home_directories.third_party_repos }}'

- name: Clone personal repos to dev user home
  # noqa: latest
  ansible.builtin.git:
    repo: '{{ item.value }}'
    dest: '{{ arch_repos_directory_path }}/{{ item.key }}'
    clone: true
  loop: '{{ arch_dev_user_git_repos | dict2items }}'
  register: arch_dev_user_repos_result
  # later tasks modify the dotfiles
  failed_when:
    - arch_dev_user_repos_result.failed
    - not 'Local modifications exist in the destination' in arch_dev_user_repos_result.msg

- name: Clone third party repos to dev user home
  # noqa: latest
  ansible.builtin.git:
    repo: '{{ item.value }}'
    dest: '{{ arch_third_party_repos_directory_path }}/{{ item.key }}'
    clone: true
  loop: '{{ arch_dev_user_third_party_git_repos | dict2items }}'
  notify:
    - Run dotfiles script
