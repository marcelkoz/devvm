- name: Clone personal repos to dev user home
  # noqa: latest
  ansible.builtin.git:
    repo: '{{ item.value }}'
    dest: '{{ arch_git_repos_directory_path }}/{{ item.key }}'
    clone: true
  loop: '{{ arch_dev_user_git_repos | dict2items }}'
  register: arch_dev_user_repos_result
  # later tasks modify the dotfiles
  failed_when:
    - arch_dev_user_repos_result.failed
    - not 'Local modifications exist in the destination' in arch_dev_user_repos_result.msg
  # make this run when only the dotfiles repo changes
  notify:
    - Run dotfiles script

- name: Clone third party repos to dev user home
  # noqa: latest
  ansible.builtin.git:
    repo: '{{ item.value }}'
    dest: '{{ arch_git_third_party_repos_directory_path }}/{{ item.key }}'
    clone: true
  loop: '{{ arch_dev_user_third_party_git_repos | dict2items }}'

- name: Set name in git config
  community.general.git_config:
    name: user.name
    scope: global
    value: '{{ arch_git_user_name }}'

- name: Set email in git config
  community.general.git_config:
    name: user.email
    scope: global
    value: '{{ arch_git_user_email }}'

- name: Set default branch name in git config
  community.general.git_config:
    name: init.defaultBranch
    scope: global
    value: '{{ arch_git_default_branch_name }}'
