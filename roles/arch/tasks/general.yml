- name: Uninstall specified pacman packages
  community.general.pacman:
    name: '{{ arch_packages_absent }}'
    state: absent

- name: Check specified pacman packages are installed
  community.general.pacman:
    name: '{{ item.value }}'
    update_cache: true
    state: present
  loop: '{{ arch_packages | dict2items }}'

- name: Uninstall specified flatpak packages
  community.general.flatpak:
    name: '{{ item.value }}'
    remote: '{{ item.key }}'
    state: absent
  loop: '{{ arch_flatpak_packages_absent | dict2items }}'

- name: Check specified flatpak packages are installed
  community.general.flatpak:
    name: '{{ item.value }}'
    remote: '{{ item.key }}'
    state: present
  loop: '{{ arch_flatpak_packages | dict2items }}'

- name: Template sudoers config
  ansible.builtin.template:
    src: 'templates/xx-wheel.j2'
    dest: '{{ arch_sudo_config_directory_path }}/10-wheel'
    mode: '0440'

- name: Add dev user
  ansible.builtin.user:
    name: '{{ arch_dev_user_name }}'
    shell: '{{ arch_dev_user_shell }}'
    groups: '{{ arch_dev_user_groups }}'
    append: true
  register: arch_dev_user_result

- name: Create home directory structure for dev user
  ansible.builtin.file:
    path: '{{ arch_dev_user_result.home }}/{{ item.value }}'
    owner: '{{ arch_dev_user_name }}'
    group: '{{ arch_dev_user_name }}'
    mode: '0755'
    state: directory
  loop: '{{ arch_dev_user_home_directories | dict2items }}'

- name: Enable and start services
  ansible.builtin.service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop:
    - docker
    - plasmalogin
    - vmtoolsd

# TODO: make this a file in the config dir
- name: Enable PHP sqlite extension
  ansible.builtin.blockinfile:
    path: '{{ arch_dev_php_config_file_path }}'
    append_newline: true
    prepend_newline: true
    backup: true
    marker: '; {mark} ANSIBLE MANAGED BLOCK'
    block: 'extension=pdo_sqlite'
