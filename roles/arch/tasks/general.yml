- name: Remove stale pacman database lock file
  ansible.builtin.file:
    path: '{{ arch_pacman_lock_file_path }}'
    state: absent
  tags:
    - never
    - arch_pacman_unlock

- name: Check pacman database lock file is absent
  ansible.builtin.stat:
    path: '{{ arch_pacman_lock_file_path }}'
  register: arch_pacman_lock_file

- name: Assert pacman database is not locked
  ansible.builtin.assert:
    that: not arch_pacman_lock_file.stat.exists
    fail_msg: >-
      {{ arch_pacman_lock_file_path }} exists. Another pacman process is running or was
      interrupted. Wait for it to finish. If the lock is stale, rerun with
      --tags arch_pacman_unlock to remove it.

- name: Uninstall specified pacman packages
  community.general.pacman:
    name: '{{ arch_packages_absent }}'
    state: absent

- name: Check specified pacman packages are installed
  community.general.pacman:
    name: '{{ arch_packages | dict2items | map(attribute="value") | flatten }}'
    update_cache: true
    state: present

- name: Uninstall specified flatpak packages
  community.general.flatpak:
    name: '{{ item.value }}'
    remote: '{{ item.key }}'
    state: absent
  loop: '{{ arch_flatpak_packages_absent | dict2items }}'

- name: Add flatpak remotes
  community.general.flatpak_remote:
    name: '{{ item }}'
    state: present
  loop: '{{ arch_flatpak_packages.keys() }}'

- name: Check specified flatpak packages are installed
  community.general.flatpak:
    name: '{{ item.value }}'
    remote: '{{ item.key }}'
    state: present
  loop: '{{ arch_flatpak_packages | dict2items }}'

- name: Template sudoers config
  ansible.builtin.template:
    src: 'templates/{{ item.src }}'
    dest: '{{ arch_sudo_config_directory_path }}/{{ item.dest }}'
    mode: '0440'
  loop:
    - { src: xx-sudo-wheel.j2, dest: 10-wheel }
    - { src: xx-sudo-prompt.j2, dest: 20-prompt }

- name: Populate skel with default home directories
  ansible.builtin.file:
    path: '{{ arch_skel_directory_path }}/{{ item.value }}'
    mode: '{{ arch_standard_directory_permissions }}'
    owner: root
    group: root
    state: directory
  loop: '{{ arch_dev_user_home_directories | dict2items }}'

- name: Add dev user
  ansible.builtin.user:
    name: '{{ arch_dev_user_name }}'
    shell: '{{ arch_dev_user_shell }}'
    groups: '{{ arch_dev_user_groups }}'
    append: true
    home: '{{ arch_dev_user_home_path }}'

- name: Create home directory structure for dev user
  ansible.builtin.file:
    path: '{{ arch_dev_user_home_path }}/{{ item.value }}'
    owner: '{{ arch_dev_user_name }}'
    group: '{{ arch_dev_user_name }}'
    mode: '{{ arch_standard_directory_permissions }}'
    state: directory
  loop: '{{ arch_dev_user_home_directories | dict2items }}'

- name: Enable and start services
  ansible.builtin.service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop:
    - docker
    - plasmalogin
    - vmtoolsd

- name: Create docker config directory
  ansible.builtin.file:
    path: '{{ arch_docker_config_directory_path }}'
    mode: '{{ arch_standard_directory_permissions }}'
    state: directory

- name: Template docker daemon.json configuration
  ansible.builtin.template:
    src: templates/daemon.json.j2
    dest: '{{ arch_docker_daemon_config_file_path }}'
    mode: '{{ arch_standard_file_permissions }}'
  notify: Restart docker

- name: Uninstall specified npm global packages
  community.general.npm:
    name: '{{ item }}'
    global: true
    state: absent
  loop: '{{ arch_npm_global_packages_absent }}'
  become: true
  become_user: '{{ arch_dev_user_name }}'
  environment:
    NPM_CONFIG_PREFIX: '{{ arch_npm_global_packages_parent_path }}'

- name: Check specified npm global packages are installed
  community.general.npm:
    name: '{{ item }}'
    global: true
    state: present
  loop: '{{ arch_npm_global_packages }}'
  become: true
  become_user: '{{ arch_dev_user_name }}'
  environment:
    NPM_CONFIG_PREFIX: '{{ arch_npm_global_packages_parent_path }}'

- name: Uninstall specified pipx packages
  community.general.pipx:
    name: '{{ item }}'
    state: absent
  loop: '{{ arch_pipx_packages_absent }}'
  become: true
  become_user: '{{ arch_dev_user_name }}'

- name: Check specified pipx packages are installed
  community.general.pipx:
    name: '{{ item }}'
    state: present
  loop: '{{ arch_pipx_packages }}'
  become: true
  become_user: '{{ arch_dev_user_name }}'
