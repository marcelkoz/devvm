- name: Build yay AUR package
  ansible.builtin.command:
    argv:
      - makepkg
      - -sf
      - --needed
      - --noconfirm
    chdir: '{{ arch_third_party_repos_directory_path }}/yay'
    creates: '{{ arch_third_party_repos_directory_path }}/yay/pkg'
  become: true
  become_user: '{{ arch_dev_user_name }}'

- name: List yay packages
  ansible.builtin.command:
    argv:
      - makepkg
      - --packagelist
    chdir: '{{ arch_third_party_repos_directory_path }}/yay'
  register: arch_yay_package_list_result
  become: true
  become_user: '{{ arch_dev_user_name }}'
  changed_when: false
  failed_when: arch_yay_package_list_result.rc != 0

- name: Install yay package
  community.general.pacman:
    name: '{{ arch_yay_package_list_result.stdout_lines[0] }}'
    state: present

- name: Check AUR package status
  ansible.builtin.command: yay -T {{ arch_aur_packages | join(' ') }}
  register: arch_aur_packages_status_result
  changed_when: false
  failed_when: false
  become: true
  become_user: '{{ arch_dev_user_name }}'
  when: arch_aur_packages | length > 0

- name: Install AUR packages
  ansible.builtin.command: yay --noconfirm -Syu {{ arch_aur_packages | join(' ') }}
  become: true
  become_user: '{{ arch_dev_user_name }}'
  changed_when: true
  when:
    - arch_aur_packages | length > 0
    - arch_aur_packages_status_result.stdout != ""
