arch_timezone: 'Europe/London'

arch_sudo_config_directory_path: /etc/sudoers.d
arch_sudo_group: wheel
arch_sudo_password_feedback: true

arch_dev_user_name: marcel
arch_dev_user_home_path: '/home/{{ arch_dev_user_name }}'
arch_dev_user_shell: /bin/bash
arch_dev_user_groups:
  - '{{ arch_sudo_group }}'
  - wireshark

arch_dev_user_git_repos:
  dotfiles: https://github.com/marcelkoz/dotfiles

arch_dev_user_third_party_git_repos:
  yay: https://aur.archlinux.org/yay.git

arch_dev_user_home_directories:
  repos: Repos
  third_party_repos: ThirdPartyRepos
  skills_repos: SkillsRepos
  desktop: Desktop
  downloads: Downloads
  documents: Documents
  scratch: Scratch
  pictures: Pictures

arch_dev_php_config_file_path: /etc/php/php.ini

arch_git_repos_directory_path: '{{ arch_dev_user_home_path }}/{{ arch_dev_user_home_directories.repos }}'
arch_git_third_party_repos_directory_path: '{{ arch_dev_user_home_path }}/{{ arch_dev_user_home_directories.third_party_repos }}'
arch_git_user_name: Marcel Kozlowski
arch_git_user_email: 37003922+marcelkoz@users.noreply.github.com
arch_git_default_branch_name: main

# https://github.com/shalva97/kde-configuration-files
arch_kde_config_directory_path: '{{ arch_dev_user_home_path }}/.config'
arch_kde_global_theme: org.kde.breezedark.desktop
arch_kde_keymap: gb
arch_kde_power_dim:
  idle: false
  timeout_seconds: -1

arch_kde_power_turn_off:
  idle: false
  timeout_seconds: -1

arch_ai_skills_repos_parent_directory_path: '{{ arch_dev_user_home_path }}/{{ arch_dev_user_home_directories.skills_repos }}'
arch_ai_skills_repos:
  tech_skills: https://github.com/marcelkoz/tech-skills
  ponytail: https://github.com/DietrichGebert/ponytail
  caveman: https://github.com/JuliusBrussee/caveman

arch_json_config:
  sort_keys: true
  indent: 2
