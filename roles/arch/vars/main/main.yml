arch_timezone: 'Europe/London'

arch_sudo_config_directory_path: /etc/sudoers.d
arch_sudo_group: wheel
arch_sudo_allowed_programs_base_path: /usr/bin
arch_sudo_allowed_programs:
  - '{{ arch_sudo_allowed_programs_base_path }}/docker'
  - '{{ arch_sudo_allowed_programs_base_path }}/pacman'
  - '{{ arch_sudo_allowed_programs_base_path }}/reboot'
  - '{{ arch_sudo_allowed_programs_base_path }}/shutdown'
  - '{{ arch_sudo_allowed_programs_base_path }}/systemctl'
  - '{{ arch_sudo_allowed_programs_base_path }}/vmware-toolbox-cmd'
  - '{{ arch_sudo_allowed_programs_base_path }}/vmware-user'

arch_dev_user_name: marcel
arch_dev_user_shell: /bin/bash
arch_dev_user_groups:
  - '{{ arch_sudo_group }}'

arch_dev_user_git_repos:
  dotfiles: https://github.com/marcelkoz/dotfiles

arch_dev_user_third_party_git_repos:
  yay: https://aur.archlinux.org/yay.git

arch_dev_user_home_directories:
  repos: Repos
  third_party_repos: ThirdPartyRepos
  desktop: Desktop
  downloads: Downloads
  documents: Documents
  scratch: Scratch

arch_git_user_name: Marcel Kozlowski
arch_git_user_email: 37003922+marcelkoz@users.noreply.github.com

arch_kde_global_theme: org.kde.breezedark.desktop
arch_kde_keymap: gb
arch_kde_power_dim:
  idle: false
  timeout_seconds: -1

arch_kde_power_turn_off:
  idle: false
  timeout_seconds: -1
