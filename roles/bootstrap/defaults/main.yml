bootstrap_timezone: Europe/London
bootstrap_locale_full: en_GB.UTF-8 UTF-8
bootstrap_locale_partial: en_GB.UTF-8
bootstrap_keymap: uk

bootstrap_temp_directory_path: /tmp/ansible-bootstrap
bootstrap_completion_file_permissions: '0444'

bootstrap_ping_target: ping.archlinux.org
bootstrap_ping_attempts: 3

bootstrap_mount_point:
  root: /mnt
  boot: /mnt/boot

bootstrap_pacstrap_essential_packages:
  - base
  - linux
  - linux-firmware
  - openssh
  - python
